<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%SEO_TITLE%</title>
    <meta name="description" content="%SEO_DESCRIPTION%" />
    <meta name="keywords" content="%SEO_KEYWORDS%" />
    <meta name="author" content="%BRAND_NAME%" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%CANONICAL_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%BRAND_PRODUCT%" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:url" content="%CANONICAL_URL%" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESCRIPTION%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TWITTER_TITLE%" />
    <meta name="twitter:description" content="%TWITTER_DESCRIPTION%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_IMAGE_ALT%" />

    <meta name="theme-color" content="%THEME_COLOR%" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      %JSON_LD%
    </script>
  </head>
  <body>
    <noscript>
      <p style="margin: 24px; font-family: Inter, system-ui, sans-serif; color: #0c0c0f">
        %BRAND_PRODUCT% builds software for hospitals, clinics, pharmacies and businesses. Enable
        JavaScript to view the full website, or email vigneshwaran@tokenly.in.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
